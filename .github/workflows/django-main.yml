name: Django main

on:
  schedule:
    # Mondays 06:00 UTC: early warning for the next Django release.
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions: {}

jobs:
  django-main:
    name: Django main (Python ${{ matrix.python-version }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - '3.13'
          - '3.14'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
          cache-suffix: ${{ github.job }}-${{ matrix.python-version }}
          cache-dependency-glob: |
            tox.ini
            setup.py
            requirements*.txt

      - name: Run the Django main environment
        run: >
          uvx --with tox-uv tox run
          -e "py$(echo '${{ matrix.python-version }}' | tr -d .)-djangomain"
