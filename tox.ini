[tox]
requires =
       tox>=4.2
env_list =
       py{38,39}-django{32,41,42}
       py310-django{32,41,42,50,51,52}
       py311-django{41,42,50,51,52}
       py312-django{42,50,51,52,60,61}
       py313-django{51,52,60,61}
       py314-django{52,60,61}
       ; the oldest djangorestframework setup.py allows, and the oldest
       ; django-filter requirements-dev.txt allows
       py38-django32-oldestdeps
       lint

[testenv]
commands =
       python \
       -W error::DeprecationWarning \
       -W error::PendingDeprecationWarning \
       -W "once:Converter 'drf_format_suffix' is already registered:" \
       -m coverage run example/manage.py test --noinput

setenv =
       PYTHONDONTWRITEBYTECODE=1
       PYTHONPATH = {toxinidir}/example
       ; one data file per env, so CI can combine them across the matrix
       COVERAGE_FILE = {toxinidir}/.coverage.{envname}
       postgres: DRFDT_TEST_TYPE = postgres

passenv =
       DRFDT_POSTGRESQL_USER
       DRFDT_POSTGRESQL_PASSWORD

deps =
       coverage
       django32: Django>=3.2,<4.0
       django41: Django>=4.1,<4.2
       django42: Django>=4.2,<5.0
       django50: Django>=5.0,<5.1
       django51: Django>=5.1,<5.2
       django52: Django>=5.2,<6.0
       django60: Django>=6.0,<6.1
       django61: Django>=6.1,<6.2
       ; run weekly by .github/workflows/django-main.yml, not part of env_list
       djangomain: https://github.com/django/django/archive/main.tar.gz
       oldestdeps: djangorestframework==3.14.0
       oldestdeps: django-filter==22.1
       !oldestdeps: djangorestframework
       !oldestdeps: django-filter
       postgres: psycopg[binary]

[testenv:lint]
skip_install = true
commands = pycodestyle rest_framework_datatables
deps =
       pycodestyle>=2.9.1
